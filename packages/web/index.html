								"@type": "Question",
								"name": "What does a buyer's agent do in Portugal?",
								"acceptedAnswer": {
									"@type": "Answer",
									"text": "A buyer's agent in Portugal is retained by the buyer and represents only the buyer's interests, unlike a listing agent who is paid by and works for the seller. In practice that means defining the brief, searching on- and off-market, valuing against comparable sales rather than asking prices, negotiating price and conditions, coordinating your lawyer and accountant, and managing the process from NIF to escritura."
								}
							},
							{
								"@type": "Question",
								"name": "How can I invest in Lisbon or Cascais remotely, without living in Portugal?",
								"acceptedAnswer": {
									"@type": "Answer",
									"text": "You can complete an entire Portuguese property purchase without entering the country, using a NIF obtained through a fiscal representative and a power of attorney (procuração) granting your lawyer authority to sign on your behalf. The sequence is: obtain a NIF remotely, open a Portuguese bank account, view by live video walkthrough, then sign the CPCV and the deed by proxy."
								}
							},
							{
								"@type": "Question",
								"name": "Is the Silver Coast (Costa Oeste) a good investment compared to Lisbon?",
								"acceptedAnswer": {
									"@type": "Answer",
									"text": "The Silver Coast typically offers a lower entry price per square metre and higher gross rental yield than Lisbon or Cascais, in exchange for stronger seasonality and slower resale. It suits buyers with a five to ten year horizon targeting capital appreciation, while Lisbon suits buyers who want liquidity and year-round occupancy, and Cascais sits between the two with steady family-relocation demand."
								}
							},
							{
								"@type": "Question",
								"name": "Can BleckTeam find properties in the Algarve, Alentejo or Porto?",

									"@type": "Answer",
									"text": "Yes. BleckTeam sources assets in the Algarve, Alentejo and Porto on request, acting as the buyer's representative rather than a local listing agency. The client gives a written mandate covering budget, asset type and objective, and BleckTeam runs the search through its network of brokers, developers and private sellers, then represents the buyer through viewings, negotiation and closing."
								}
							},
							{
								"@type": "Question",
								"name": "Can I buy property in Portugal as a non-resident?",
								"acceptedAnswer": {
									"@type": "Answer",
									"text": "Yes. Portugal places no restrictions on foreign ownership, EU or otherwise. A buyer needs a Portuguese tax number (NIF) and a Portuguese bank account, both of which can be arranged remotely. Buying does not grant residency: since October 2023 real estate no longer qualifies for the Golden Visa, so residency runs through a separate route such as the D7 or the D8 digital nomad visa."
								}
							},
							{
								"@type": "Question",
								"name": "What does buying property in Portugal cost on top of the price?",
								"acceptedAnswer": {
									"@type": "Answer",
									"text": "As of 2026, buyers who are not Portuguese tax residents pay a flat 7.5% IMT transfer tax on residential property, instead of the progressive scale that applies to residents. On top of that, budget 0.8% stamp duty, notary and registration of 900 to 1,500 euros, and legal fees of 1 to 1.5 percent plus VAT."
								}
							},

								"@type": "Question",
								"name": "Can a non-resident get a mortgage in Portugal?",
								"acceptedAnswer": {
									"@type": "Answer",
									"text": "Generally yes. Portuguese banks typically finance 60 to 80 percent for non-residents, depending on the buyer's profile and the country their income comes from. A pre-approval in principle before making offers is strongly advised."
